name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: studyuser
          POSTGRES_PASSWORD: studypass
          POSTGRES_DB: studyvault_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      
      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
      
      - name: Lint with Ruff
        run: |
          cd backend
          ruff check .
      
      - name: Run tests
        env:
          DATABASE_URL: postgresql://studyuser:studypass@localhost:5432/studyvault_test
        run: |
          cd backend
          pytest -v
